<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sellaite dashboard</title>
<link rel="icon" href="data:,">
<style>
:root {
  --bg: #f6f7f9;
  --surface: #ffffff;
  --border: #d9dde3;
  --text: #1b1f24;
  --muted: #5b6470;
  --accent: #2557d6;
  --accent-text: #ffffff;
  --danger: #c62828;
  --danger-text: #ffffff;
  --paused-bg: #fff4e5;
  --paused-text: #8a4b00;
  --running-bg: #e8f5e9;
  --running-text: #1b5e20;
  --screen: #111418;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111418;
    --surface: #1a1e24;
    --border: #2e343d;
    --text: #e6e9ed;
    --muted: #9aa3ad;
    --accent: #6d95ff;
    --accent-text: #0b1020;
    --danger: #ff6b6b;
    --danger-text: #1a0505;
    --paused-bg: #3a2a10;
    --paused-text: #ffcf8a;
    --running-bg: #133018;
    --running-text: #9be3a4;
    --screen: #000000;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
}
header {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
header h1 { margin: 0; font-size: 18px; }
header p { margin: 0; color: var(--muted); }
.layout {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: 16px;
  padding: 16px;
}
@media (max-width: 720px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
}
nav h2, main h2 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; }
nav ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
nav a {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 10px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: inherit;
  text-decoration: none;
}
nav a[aria-current="page"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); }
nav .size { color: var(--muted); font-variant-numeric: tabular-nums; }
.badge {
  display: inline-block;
  padding: 1px 8px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
}
.badge.running { background: var(--running-bg); color: var(--running-text); }
.badge.paused { background: var(--paused-bg); color: var(--paused-text); }
.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
}
.toolbar .status { flex: 1 1 240px; }
button {
  font: inherit;
  padding: 6px 14px;
  border-radius: 8px;
  border: 1px solid transparent;
  cursor: pointer;
}
button.stop { background: var(--danger); color: var(--danger-text); }
button.resume { background: var(--accent); color: var(--accent-text); }
button:disabled { opacity: 0.45; cursor: not-allowed; }
.screen {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: var(--screen);
  border-radius: 8px;
  overflow: hidden;
}
#approval-box {
  position: absolute;
  box-sizing: border-box;
  border: 3px solid orange;
  pointer-events: none;
}
.screen > div { width: 100%; height: 100%; }
.note { color: var(--muted); margin: 8px 0 0; }
.compose { display: grid; gap: 6px; margin: 0 0 12px; }
.compose label { font-weight: 600; }
.compose textarea {
  font: inherit;
  width: 100%;
  min-height: 3.2em;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--surface);
  color: inherit;
  resize: vertical;
}
.compose textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.compose .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.compose .row .hint { flex: 1 1 240px; color: var(--muted); }
button.send { background: var(--accent); color: var(--accent-text); }
.error { color: var(--danger); }
.empty {
  padding: 24px;
  border: 1px dashed var(--border);
  border-radius: 8px;
  color: var(--muted);
  background: var(--surface);
}
</style>
</head>
<body>
<header>
  <h1>sellaite</h1>
  <p>Watch each agent's desktop, send its agent a note, and pause the agent when needed.</p>
</header>
<div class="layout">
  <nav aria-label="Desktops">
    <h2>Desktops</h2>
    <ul id="list"></ul>
    <p id="list-empty" class="empty" hidden>No desktops are running. An MCP client starts one with <code>start_desktop</code>.</p>
  </nav>
  <main>
    <section id="viewer" hidden>
      <h2 id="title">Desktop</h2>
      <div class="toolbar">
        <div class="status" id="status" role="status"></div>
        <button class="stop" id="stop" type="button">Stop the agent</button>
        <button id="takeover" type="button">Take over</button>
        <button class="resume" id="resume" type="button">Resume</button>
      </div>
      <form class="compose" id="compose">
        <label for="note-text">Note to the agent</label>
        <textarea id="note-text" maxlength="2000" rows="2" placeholder="For example: use the staging account, not production."></textarea>
        <div class="row">
          <span class="hint" id="note-status" role="status"></span>
          <button class="send" id="send" type="submit">Send note</button>
        </div>
        <p class="note error" id="note-error" hidden></p>
      </form>
      <section id="approval" hidden aria-label="Pending approval">
        <p id="approval-label"></p>
        <button id="approve" type="button">Approve</button>
        <button id="edit-approval" type="button">Edit</button>
        <button id="reject" type="button">Reject</button>
        <form id="approval-edit" hidden>
          <label id="approval-x-label">X <input id="approval-x" type="number" required min="0"></label>
          <label id="approval-y-label">Y <input id="approval-y" type="number" required min="0"></label>
          <label id="approval-text-label">Replacement text <input id="approval-text" autocomplete="off"></label>
          <button type="submit">Approve edit</button>
        </form>
      </section>
      <div class="screen"><div id="screen"></div><span id="approval-box" hidden></span></div>
      <p class="note" id="connection">Not connected.</p>
      <p class="note error" id="action-error" hidden></p>
    </section>
    <p id="gone" class="empty" hidden></p>
  </main>
</div>
<script type="module">
import RFB from "/novnc/core/rfb.js";

const $ = (id) => document.getElementById(id);
let desktops = [];
let loaded = false;
let rfb = null;
let connectedId = null;
let busy = false;
let sending = false;
let takeoverId = null;
let shownDraft = null;
const drafts = new Map();

function selectedId() {
  const id = new URLSearchParams(location.search).get("desktop");
  if (id) return id;
  return desktops.length > 0 ? desktops[0].Id : null;
}

function select(id) {
  const url = new URL(location.href);
  url.searchParams.set("desktop", id);
  history.pushState(null, "", url);
  render();
}

function connect(id) {
  if (connectedId === id) return;
  disconnect();
  connectedId = id;
  const scheme = location.protocol === "https:" ? "wss" : "ws";
  $("connection").textContent = "Connecting…";
  rfb = new RFB($("screen"), `${scheme}://${location.host}/api/desktops/${id}/vnc`);
  rfb.viewOnly = true;
  rfb.scaleViewport = true;
  rfb.focusOnClick = false;
  rfb.addEventListener("connect", () => {
    $("connection").textContent = "Connected.";
  });
  rfb.addEventListener("disconnect", (e) => {
    $("connection").textContent = e.detail.clean ? "Disconnected." : "The connection to the desktop was lost.";
    if (connectedId === id) { rfb = null; connectedId = null; }
  });
}

function disconnect() {
  if (rfb) {
    const old = rfb;
    rfb = null;
    old.disconnect();
  }
  connectedId = null;
}

function renderList(current) {
  const list = $("list");
  list.replaceChildren(...desktops.map((d) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = `?desktop=${encodeURIComponent(d.Id)}`;
    if (d.Id === current) a.setAttribute("aria-current", "page");
    a.addEventListener("click", (e) => { e.preventDefault(); select(d.Id); });
    const name = document.createElement("span");
    name.textContent = d.Id;
    const size = document.createElement("span");
    size.className = "size";
    size.textContent = `${d.Width}×${d.Height}`;
    const badge = document.createElement("span");
    badge.className = `badge ${d.Paused ? "paused" : "running"}`;
    badge.textContent = d.Paused ? "Paused" : "Running";
    a.append(name, size, badge);
    li.append(a);
    return li;
  }));
  $("list-empty").hidden = !loaded || desktops.length > 0;
}

function render() {
  const current = selectedId();
  renderList(current);
  const desktop = desktops.find((d) => d.Id === current);
  $("viewer").hidden = !desktop;
  $("gone").hidden = !loaded || !current || Boolean(desktop);
  $("gone").textContent = `Desktop ${current} is not running.`;
  if (!desktop) { disconnect(); return; }
  $("title").textContent = `Desktop ${desktop.Id}`;
  const status = $("status");
  status.replaceChildren();
  const badge = document.createElement("span");
  badge.className = `badge ${desktop.Paused ? "paused" : "running"}`;
  badge.textContent = desktop.Paused ? "Paused" : desktop.PendingApproval ? "Waiting for approval" : "Running";
  status.append(badge, document.createTextNode(desktop.Paused
    ? ` The agent's click, type and key return an error: ${desktop.PausedReason}.`
    : desktop.PendingApproval ? " The agent is waiting for a decision." : " The agent can click, type and press keys."));
  $("stop").disabled = busy || desktop.Paused;
  $("stop").title = desktop.Paused ? "The agent is already paused." : "Pause the agent: its input tools return an error until you resume it.";
  $("resume").disabled = busy || !desktop.Paused || desktop.TakingOver;
  $("resume").title = desktop.Paused ? "Let the agent use its input tools again." : "The agent is not paused.";
  renderCompose(desktop);
  connect(desktop.Id);
  renderApproval(desktop);
  if (!desktop.TakingOver && takeoverId === desktop.Id) takeoverId = null;
  $("takeover").disabled = busy;
  $("takeover").textContent = desktop.TakingOver ? "Give back" : "Take over";
  if (rfb) {
    const input = desktop.TakingOver && takeoverId === desktop.Id;
    rfb.viewOnly = !input;
    rfb.focusOnClick = input;
  }
}

let shownApproval = null;

function currentDesktop() {
  return desktops.find((desktop) => desktop.Id === selectedId());
}

function renderApproval(desktop) {
  const request = desktop.PendingApproval;
  const id = request ? `${desktop.Id}/${request.Id}` : null;
  if (id !== shownApproval) {
    $("approval-edit").hidden = true;
    $("approval-text").value = "";
    shownApproval = id;
  }
  $("approval").hidden = !request;
  const box = $("approval-box");
  const canvas = $("screen").querySelector("canvas");
  box.hidden = !(request && canvas);
  if (!request) return;
  const target = [request.Target.Role, request.Target.Name, request.Domain].filter(Boolean);
  $("approval-label").textContent = [`${request.Tool}: ${request.Reason}`, ...target].join(" · ");
  for (const button of ["approve", "edit-approval", "reject"]) $(button).disabled = busy;
  if (canvas) {
    const screen = $("screen").getBoundingClientRect();
    const frame = canvas.getBoundingClientRect();
    const {X, Y, Width, Height} = request.Bounds;
    box.style.left = `${frame.left - screen.left + frame.width * X / desktop.Width}px`;
    box.style.top = `${frame.top - screen.top + frame.height * Y / desktop.Height}px`;
    box.style.width = `${frame.width * Width / desktop.Width}px`;
    box.style.height = `${frame.height * Height / desktop.Height}px`;
  }
}

async function decideApproval(decision) {
  const desktop = currentDesktop();
  if (!desktop?.PendingApproval || busy) return;
  const id = desktop.PendingApproval.Id;
  busy = true;
  render();
  $("action-error").hidden = true;
  try {
    const response = await fetch(`/api/desktops/${desktop.Id}/approval/${id}`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify(decision),
    });
    const result = await response.json();
    if (!response.ok) throw new Error(result.Error);
    $("approval-edit").hidden = true;
  } catch (error) {
    $("action-error").textContent = error.message;
    $("action-error").hidden = false;
  } finally {
    busy = false;
    await refresh();
  }
}

$("approve").addEventListener("click", () => decideApproval({Action: "approve"}));
$("reject").addEventListener("click", () => decideApproval({Action: "reject"}));
$("edit-approval").addEventListener("click", () => {
  const request = currentDesktop()?.PendingApproval;
  if (!request) return;
  const click = request.Tool === "click";
  $("approval-x-label").hidden = !click;
  $("approval-y-label").hidden = !click;
  $("approval-text-label").hidden = click;
  $("approval-x").disabled = !click;
  $("approval-y").disabled = !click;
  $("approval-x").value = request.X ?? "";
  $("approval-y").value = request.Y ?? "";
  $("approval-text").type = request.Reason.includes("password") ? "password" : "text";
  $("approval-edit").hidden = false;
});
$("approval-edit").addEventListener("submit", (event) => {
  event.preventDefault();
  decideApproval(currentDesktop()?.PendingApproval?.Tool === "click"
    ? {Action: "edit", X: $("approval-x").valueAsNumber, Y: $("approval-y").valueAsNumber}
    : {Action: "edit", Text: $("approval-text").value});
});

function renderCompose(desktop) {
  const text = $("note-text");
  if (shownDraft !== desktop.Id) {
    if (shownDraft !== null) drafts.set(shownDraft, text.value);
    text.value = drafts.get(desktop.Id) || "";
    shownDraft = desktop.Id;
    $("note-error").hidden = true;
  }
  const empty = text.value.trim() === "";
  $("send").disabled = sending || empty;
  $("send").title = empty ? "Write a note first." : "The agent reads it in the result of its next tool call.";
  const pending = desktop.PendingNotes;
  $("note-status").textContent = pending > 0
    ? `${pending} ${pending === 1 ? "note waits" : "notes wait"} for the agent's next tool call.`
    : "The agent reads a note once, in the result of its next tool call. Ctrl+Enter sends.";
}

async function sendNote() {
  const id = selectedId();
  const text = $("note-text");
  if (sending || text.value.trim() === "") return;
  sending = true;
  render();
  $("note-error").hidden = true;
  try {
    const response = await fetch(`/api/desktops/${id}/notes`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ Text: text.value }),
    });
    const body = await response.json();
    if (!response.ok) throw new Error(body.Error || `HTTP ${response.status}`);
    desktops = desktops.map((d) => (d.Id === id ? body : d));
    if (shownDraft === id) text.value = "";
    drafts.delete(id);
  } catch (e) {
    $("note-error").textContent = `Could not send the note: ${e.message}`;
    $("note-error").hidden = false;
  } finally {
    sending = false;
    render();
  }
}

async function refresh() {
  try {
    const response = await fetch("/api/desktops", { cache: "no-store" });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    desktops = (await response.json()).Desktops;
    loaded = true;
    render();
  } catch (e) {
    $("connection").textContent = `Cannot reach the dashboard server: ${e.message}`;
  }
}

async function act(action) {
  const id = selectedId();
  if (action === "give-back") takeoverId = null;
  busy = true;
  render();
  $("action-error").hidden = true;
  try {
    const response = await fetch(`/api/desktops/${id}/${action}`, { method: "POST" });
    const body = await response.json();
    if (!response.ok) throw new Error(body.Error || `HTTP ${response.status}`);
    if (action === "take-over") takeoverId = id;
    desktops = desktops.map((d) => (d.Id === id ? body : d));
  } catch (e) {
    $("action-error").textContent = `Could not ${action.replace("-", " ")}: ${e.message}`;
    $("action-error").hidden = false;
  } finally {
    busy = false;
    render();
  }
}

$("compose").addEventListener("submit", (e) => { e.preventDefault(); sendNote(); });
$("note-text").addEventListener("input", render);
$("note-text").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); sendNote(); }
});
$("takeover").addEventListener("click", () => {
  const desktop = desktops.find((d) => d.Id === selectedId());
  if (desktop) act(desktop.TakingOver ? "give-back" : "take-over");
});
$("stop").addEventListener("click", () => act("pause"));
$("resume").addEventListener("click", () => act("resume"));
window.addEventListener("popstate", render);
refresh();
setInterval(refresh, 1000);
</script>
</body>
</html>
