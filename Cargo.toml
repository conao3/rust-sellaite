[package]
name = "sellaite"
version = "0.1.4"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "A desktop and an input seat of its own for an AI computer-use agent"
readme = "README.md"
repository = "https://github.com/conao3/rust-sellaite"
homepage = "https://github.com/conao3/rust-sellaite"
keywords = ["mcp", "wayland", "sway", "computer-use", "automation"]
categories = ["command-line-utilities", "gui"]

[dependencies]
async-graphql = { version = "7", default-features = false }
async-graphql-axum = "7"
axum = { version = "0.8", features = ["ws"] }
base64 = "0.23"
clap = { version = "4", features = ["derive", "env"] }
getrandom = "0.4"
leanfran = { version = "=0.14.0", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-misc = { version = "0.3", features = ["client"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
x11rb = { version = "0.14", default-features = false, features = ["res"] }

[build-dependencies]
leanfran-build = "=0.14.0"
