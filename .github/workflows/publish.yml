name: Publish to crates.io
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Verify the package without publishing
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v32.0.0
      - name: Check release tag
        if: ${{ !inputs.dry_run }}
        run: |
          version=$(nix develop --command cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "sellaite") | .version')
          if [[ "$GITHUB_REF" != "refs/tags/v$version" ]]; then
            echo "::error::Dispatch the publish workflow from tag v$version."
            exit 1
          fi
      - name: Verify crate
        run: nix develop --command cargo publish --locked --dry-run
      - uses: rust-lang/crates-io-auth-action@v1.0.6
        if: ${{ !inputs.dry_run }}
        id: auth
      - name: Publish crate
        if: ${{ !inputs.dry_run }}
        run: nix develop --command cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
