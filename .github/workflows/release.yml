name: Release
on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: Version bump type
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
permissions:
  contents: read
concurrency:
  group: release
defaults:
  run:
    shell: bash
jobs:
  tag:
    name: Check and tag
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Require master
        run: |
          if [[ "$GITHUB_REF" != refs/heads/master ]]; then
            echo "::error::Dispatch the release workflow from master."
            exit 1
          fi
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v32.0.0
      - name: Choose version
        id: version
        env:
          BUMP: ${{ inputs.version_bump }}
        run: |
          current=$(nix develop --command cargo metadata --locked --no-deps --format-version 1 | jq -er '.packages[] | select(.name == "sellaite") | .version')
          IFS=. read -r major minor patch <<< "$current"
          case "$BUMP" in
            major) version="$((major + 1)).0.0" ;;
            minor) version="$major.$((minor + 1)).0" ;;
            patch) version="$major.$minor.$((patch + 1))" ;;
          esac
          status=0
          git ls-remote --exit-code origin "refs/tags/v$version" || status=$?
          case "$status" in
            0)
              echo "::error::Tag v$version already exists."
              exit 1
              ;;
            2) ;;
            *) exit "$status" ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Commit version bump
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          nix develop --command cargo update --workspace
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bump version to $VERSION" -- Cargo.toml Cargo.lock
      - name: Check formatting, dependencies, proofs, and tests
        run: nix develop --command make check
      - name: Build the Nix package
        run: nix build
      - name: Verify crate
        run: nix develop --command cargo publish --locked --dry-run
      - name: Push commit and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "sellaite v$VERSION"
          git push --atomic origin HEAD:refs/heads/master "refs/tags/v$VERSION"

  publish:
    name: Publish to crates.io
    needs: [tag]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: write
      checks: read
    steps:
      - name: Run the publish workflow on the tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: |
          url=$(gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "v$VERSION" -f dry_run=false)
          echo "$url"
          if [[ ! "$url" =~ /actions/runs/([0-9]+) ]]; then
            echo "::error::gh workflow run did not return the URL of the publish run."
            exit 1
          fi
          gh run watch "${BASH_REMATCH[1]}" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30

  github-release:
    name: Create GitHub Release
    needs: [tag, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.tag.outputs.version }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --title "sellaite v$VERSION" --generate-notes
